<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JobFinder</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <header>
    <div class="header-inner">
      <div>
        <h1>JobFinder</h1>
        <p class="subtitle">Entry-level &amp; new grad opportunities</p>
      </div>
      <button class="btn-primary" id="scrapeBtn">Refresh Jobs</button>
    </div>
    <input type="text" id="searchInput" class="search-input" placeholder="Search by title, company, or keyword..." />
  </header>

  <div class="toolbar">
    <div class="toolbar-left">
      <button class="pill active" id="savedToggle">Saved Only</button>

      <!-- Location multi-select -->
      <div class="loc-wrap" id="locWrap">
        <div class="loc-box" id="locBox">
          <span class="loc-placeholder" id="locPlaceholder">Location</span>
          <div class="loc-tags" id="locTags"></div>
          <input class="loc-input" id="locInput" type="text" autocomplete="off" />
        </div>
        <div class="loc-dropdown hidden" id="locDropdown"></div>
      </div>

      <!-- Industry select -->
      <select class="pill pill-select" id="industrySelect">
        <option value="">All Industries</option>
      </select>
    </div>

    <div class="toolbar-right">
      <label class="btn-resume" id="resumeLabel" for="resumeInput">&#128196; Upload Resume</label>
      <input type="file" id="resumeInput" accept=".pdf" style="display:none" />
      <span class="resume-tag hidden" id="resumeTag"></span>
      <button class="resume-clear hidden" id="resumeClear" title="Clear resume">&#10005;</button>
    </div>
  </div>

  <div id="status" class="status hidden"></div>

  <div id="jobList" class="job-grid">
    <p class="empty-msg">Loading jobs...</p>
  </div>

  <template id="jobCard">
    <div class="card">
      <div class="card-top">
        <div class="card-title-block">
          <a class="card-title" href="" target="_blank" rel="noopener"></a>
          <span class="card-company"></span>
        </div>
        <div class="card-actions">
          <button class="btn-save" title="Save">&#9825;</button>
          <button class="btn-dismiss" title="Dismiss">&#10005;</button>
        </div>
      </div>
      <div class="card-meta">
        <span class="badge"></span>
        <span class="card-location"></span>
        <span class="card-date"></span>
        <span class="card-industry hidden"></span>
        <span class="card-match hidden"></span>
      </div>
      <div class="card-keywords"></div>
      <div class="card-snippet"></div>
      <textarea class="card-notes" placeholder="Add notes..."></textarea>
    </div>
  </template>

  <!-- Modal -->
  <div id="modal" class="modal-overlay hidden">
    <div class="modal">
      <button class="modal-close" id="modalClose">&#10005;</button>
      <div class="modal-head">
        <div class="modal-title-row">
          <h2 id="modalTitle"></h2>
          <span class="badge" id="modalBadge"></span>
        </div>
        <span class="modal-company" id="modalCompany"></span>
        <div class="modal-meta">
          <span id="modalLocation"></span>
          <span class="modal-industry hidden" id="modalIndustry"></span>
        </div>
      </div>
      <div class="modal-salary">
        <div class="salary-label">Estimated Salary</div>
        <div class="salary-val" id="modalSalaryVal">Analyzing...</div>
      </div>
      <div class="modal-section-title">AI Summary</div>
      <div class="modal-desc" id="modalDesc">
        <div class="ai-loading"><div class="spinner"></div>Analyzing with Gemini 2.5...</div>
      </div>
      <div class="modal-footer">
        <a class="btn-primary" id="modalLink" href="" target="_blank" rel="noopener">View Listing ↗</a>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
